env:
  CARGO_TERM_COLOR: "always"
  CARGO_BUILD_JOBS: "2"
  RUST_TEST_THREADS: "2"
  CTX_BOOTSTRAP_BAZELISK: "1"
  CTX_BAZELISK_VERSION: "v1.29.0"
  CTX_RUST_TOOLCHAIN: "1.97.1"

steps:
  - label: ":bazel: public smoke gate"
    key: "public-smoke"
    if: build.source != "schedule" && build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") != "1"
    command: |
      bash scripts/buildkite-public-ci.sh --mode=ci
    agents:
      queue: "default"
    concurrency: 1
    concurrency_group: "ctx/public-smoke/default-hosted"
    timeout_in_minutes: 60
    artifact_paths:
      - "bazel-testlogs/**/*.log"
      - "bazel-testlogs/**/test.outputs/**/*"
      - "bazel-testlogs/**/*.zip"
      - "target/ctx-artifacts/check/**"

  - label: ":night_with_stars: public nightly performance and fault gate"
    key: "public-nightly"
    if: build.source == "schedule" && build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") != "1"
    command: |
      bash scripts/buildkite-public-ci.sh --mode=nightly
    agents:
      queue: "default"
    concurrency: 1
    concurrency_group: "ctx/public-nightly/default-hosted"
    timeout_in_minutes: 120
    artifact_paths:
      - "bazel-testlogs/**/*.log"
      - "bazel-testlogs/**/test.outputs/**/*"
      - "bazel-testlogs/**/*.zip"
      - "target/ctx-artifacts/check/**"

  - label: ":rocket: public release qualification"
    key: "public-release"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1"
    command: |
      bash scripts/buildkite-public-ci.sh --mode=release
    agents:
      queue: "default"
    concurrency: 1
    concurrency_group: "ctx/public-release/default-hosted"
    timeout_in_minutes: 120
    artifact_paths:
      - "bazel-testlogs/**/*.log"
      - "bazel-testlogs/**/test.outputs/**/*"
      - "bazel-testlogs/**/*.zip"
      - "target/ctx-artifacts/check/**"

  - label: ":swift: required macOS Swift SDK implementation"
    key: "sdk-swift-required"
    if: build.source != "schedule" || build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1"
    command: |
      swift --version
      CTX_SDK_RUN_LOCAL_SMOKE=0 bash scripts/check-sdks.sh --groups=swift --required-groups=swift
    agents:
      queue: "ctx-release-macos-arm64"
      os: "darwin"
      arch: "arm64"
    concurrency: 1
    concurrency_group: "ctx/sdk-swift-required/ctx-release-macos-arm64"
    timeout_in_minutes: 30

  - wait: ~
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1"

  - label: ":package: public CLI linux-x64"
    key: "public-cli-linux-x64"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1"
    command: |
      source_commit="$(git rev-parse --verify HEAD^{commit})"
      smoke_args=()
      if [[ "$${CTX_PUBLIC_CLI_NATIVE_SMOKE_MATRIX:-0}" == "1" ]]; then
        smoke_args+=(--native-smoke-dir target/public-cli-native-smoke/linux-x64)
      fi
      scripts/release/build-linux-bazel-release.sh \
        --platform linux-x64 \
        --source-commit "$${source_commit}" \
        --output-dir target/public-cli-artifacts \
        "$${smoke_args[@]}"
    agents:
      queue: "release-linux-managed"
      ctx-runner-class: "release-linux-control"
      os: "linux"
      arch: "x86_64"
    timeout_in_minutes: 60
    artifact_paths:
      - "target/public-cli-artifacts/ctx"
      - "target/public-cli-artifacts/ctx.sha256"
      - "target/public-cli-artifacts/ctx.version"
      - "target/public-cli-artifacts/ctx.build-info.json"
      - "target/public-cli-artifacts/ctx.cdx.json"
      - "target/public-cli-artifacts/ctx.cdx.json.sha256"
      - "target/public-cli-artifacts/ctx.third-party-notices.txt"
      - "target/public-cli-artifacts/ctx.third-party-notices.txt.sha256"
      - "target/public-cli-artifacts/ctx.size.json"
      - "target/public-cli-artifacts/ctx.candidate.json"
      - "target/public-cli-artifacts/ctx.dependency-advisory.json"
      - "target/public-cli-artifacts/ctx-onnxruntime-linux-x64.tar.gz"
      - "target/public-cli-artifacts/ctx-onnxruntime-linux-x64.tar.gz.sha256"
      - "target/public-cli-artifacts/ctx-onnxruntime-linux-x64.tar.zst"
      - "target/public-cli-artifacts/ctx-onnxruntime-linux-x64.tar.zst.sha256"
      - "target/public-cli-artifacts/ctx-onnxruntime-linux-x64.tar.zst.asset.json"
      - "target/public-cli-artifacts/ctx-linux-x64.release-complete.json"
      - "target/public-cli-native-smoke/linux-x64/candidate-smoke.json"
      - "target/public-cli-native-smoke/linux-x64/smoke.log"
      - "target/public-cli-native-smoke/linux-x64/**/daemon-smoke.log"
      - "target/public-cli-native-smoke/linux-x64/**/daemon-status.*"
      - "target/public-cli-native-smoke/linux-x64/**/semantic-search.*"

  - label: ":package: public CLI linux-aarch64"
    key: "public-cli-linux-aarch64"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1"
    command: |
      source_commit="$(git rev-parse --verify HEAD^{commit})"
      smoke_args=()
      if [[ "$${CTX_PUBLIC_CLI_NATIVE_SMOKE_MATRIX:-0}" == "1" ]]; then
        smoke_args+=(--native-smoke-dir target/public-cli-native-smoke/linux-aarch64)
      fi
      scripts/release/build-linux-bazel-release.sh \
        --platform linux-arm64 \
        --source-commit "$${source_commit}" \
        --output-dir target/public-cli-artifacts \
        "$${smoke_args[@]}"
    agents:
      queue: "linux-arm64"
      os: "linux"
      arch: "arm64"
    timeout_in_minutes: 60
    artifact_paths:
      - "target/public-cli-artifacts/ctx-linux-aarch64"
      - "target/public-cli-artifacts/ctx-linux-aarch64.sha256"
      - "target/public-cli-artifacts/ctx-linux-aarch64.version"
      - "target/public-cli-artifacts/ctx-linux-aarch64.build-info.json"
      - "target/public-cli-artifacts/ctx-linux-aarch64.cdx.json"
      - "target/public-cli-artifacts/ctx-linux-aarch64.cdx.json.sha256"
      - "target/public-cli-artifacts/ctx-linux-aarch64.third-party-notices.txt"
      - "target/public-cli-artifacts/ctx-linux-aarch64.third-party-notices.txt.sha256"
      - "target/public-cli-artifacts/ctx-linux-aarch64.size.json"
      - "target/public-cli-artifacts/ctx-linux-aarch64.candidate.json"
      - "target/public-cli-artifacts/ctx-linux-aarch64.dependency-advisory.json"
      - "target/public-cli-artifacts/ctx-onnxruntime-linux-aarch64.tar.gz"
      - "target/public-cli-artifacts/ctx-onnxruntime-linux-aarch64.tar.gz.sha256"
      - "target/public-cli-artifacts/ctx-onnxruntime-linux-aarch64.tar.zst"
      - "target/public-cli-artifacts/ctx-onnxruntime-linux-aarch64.tar.zst.sha256"
      - "target/public-cli-artifacts/ctx-onnxruntime-linux-aarch64.tar.zst.asset.json"
      - "target/public-cli-artifacts/ctx-linux-aarch64.release-complete.json"
      - "target/public-cli-native-smoke/linux-aarch64/candidate-smoke.json"
      - "target/public-cli-native-smoke/linux-aarch64/smoke.log"
      - "target/public-cli-native-smoke/linux-aarch64/**/daemon-smoke.log"
      - "target/public-cli-native-smoke/linux-aarch64/**/daemon-status.*"
      - "target/public-cli-native-smoke/linux-aarch64/**/semantic-search.*"

  - label: ":package: public CLI windows-x64"
    key: "public-cli-windows-x64"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1"
    command: |
      bash scripts/bazelw run //:ctx_release_windows_x64 --config=release -- \
        --output-dir target/public-cli-artifacts
      bash scripts/build-onnxruntime-sidecar.sh windows-x64
    agents:
      queue: "windows-x64"
      os: "windows"
      arch: "x86_64"
    concurrency: 1
    concurrency_group: "ctx-public-cli-windows-native"
    timeout_in_minutes: 60
    artifact_paths:
      - "target/public-cli-artifacts/ctx.exe"
      - "target/public-cli-artifacts/ctx.exe.sha256"
      - "target/public-cli-artifacts/ctx.exe.version"
      - "target/public-cli-artifacts/ctx.exe.expected-version"
      - "target/public-cli-artifacts/ctx.exe.build-info.json"
      - "target/public-cli-artifacts/ctx.exe.cdx.json"
      - "target/public-cli-artifacts/ctx.exe.cdx.json.sha256"
      - "target/public-cli-artifacts/ctx.exe.third-party-notices.txt"
      - "target/public-cli-artifacts/ctx.exe.third-party-notices.txt.sha256"
      - "target/public-cli-artifacts/ctx.exe.size.json"
      - "target/public-cli-artifacts/ctx.exe.candidate.json"
      - "target/public-cli-artifacts/ctx-onnxruntime-windows-x64.zip"
      - "target/public-cli-artifacts/ctx-onnxruntime-windows-x64.zip.sha256"

  - label: ":package: public CLI macos-arm64"
    key: "public-cli-macos-arm64"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      rustup toolchain install "$${CTX_RUST_TOOLCHAIN}" --profile minimal
      rustup run "$${CTX_RUST_TOOLCHAIN}" cargo check --workspace --all-targets --all-features --locked
      export CTX_MACOS_RELEASE_SIGNING=required
      export CTX_MACOS_SIGNING_SECRET_SOURCE=injected
      # Buildkite injects signing values for this trusted hosted release job;
      # narrow launcher calls scrub the signer/notary worker environment.
      scripts/bazelw run //:ctx_release_macos_arm64 --config=release -- \
        --output-dir target/public-cli-artifacts
      scripts/build-onnxruntime-sidecar.sh macos-arm64
      scripts/stage-github-release-assets.sh --transcode-runtime macos-arm64
      if [[ "$${CTX_PUBLIC_CLI_NATIVE_SMOKE_MATRIX:-0}" == "1" ]]; then
        smoke_root="target/public-cli-native-smoke/macos-arm64/coreml"
        mkdir -p "$${smoke_root}"
        expected_version="$(sed -n 's/^ctx //p' \
          target/public-cli-artifacts/ctx-macos-arm64.version)"
        [[ -n "$${expected_version}" ]]
        scripts/run-native-candidate-smoke.sh \
          target/public-cli-artifacts/ctx-macos-arm64 \
          tests/fixtures/custom-history-jsonl/basic.jsonl \
          "$${expected_version}" \
          target/public-cli-native-smoke/macos-arm64/candidate-smoke.json
        if ! scripts/smoke-daemon-semantic-release.sh \
          --coreml \
          --runtime-platform macos-arm64 \
          --ctx target/public-cli-artifacts/ctx-macos-arm64 \
          --data-root "$${smoke_root}" \
          --require-authoritative \
          --keep-root >"$${smoke_root}/smoke.log" 2>&1; then
          cat "$${smoke_root}/smoke.log"
          exit 1
        fi
        cat "$${smoke_root}/smoke.log"

        onnx_smoke_root="target/public-cli-native-smoke/macos-arm64/onnxruntime"
        mkdir -p "$${onnx_smoke_root}"
        if ! scripts/smoke-daemon-semantic-release.sh \
          --runtime-archive target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.tar.gz \
          --runtime-platform macos-arm64 \
          --ctx target/public-cli-artifacts/ctx-macos-arm64 \
          --data-root "$${onnx_smoke_root}" \
          --require-authoritative \
          --keep-root >"$${onnx_smoke_root}/smoke.log" 2>&1; then
          cat "$${onnx_smoke_root}/smoke.log"
          exit 1
        fi
        cat "$${onnx_smoke_root}/smoke.log"
      fi
    secrets:
      - "APPLE_CODESIGN_CERT_P12_B64"
      - "APPLE_CODESIGN_CERT_PASSWORD"
      - "NOTARY_ISSUER"
      - "NOTARY_KEY_ID"
      - "NOTARY_KEY_P8_B64"
    agents:
      queue: "ctx-release-macos-arm64"
      os: "darwin"
      arch: "arm64"
    concurrency: 1
    concurrency_group: "ctx-public-cli-macos-native"
    timeout_in_minutes: 120
    artifact_paths:
      - "target/public-cli-artifacts/ctx-macos-arm64"
      - "target/public-cli-artifacts/ctx-macos-arm64.sha256"
      - "target/public-cli-artifacts/ctx-macos-arm64.version"
      - "target/public-cli-artifacts/ctx-macos-arm64.build-info.json"
      - "target/public-cli-artifacts/ctx-macos-arm64.cdx.json"
      - "target/public-cli-artifacts/ctx-macos-arm64.cdx.json.sha256"
      - "target/public-cli-artifacts/ctx-macos-arm64.third-party-notices.txt"
      - "target/public-cli-artifacts/ctx-macos-arm64.third-party-notices.txt.sha256"
      - "target/public-cli-artifacts/ctx-macos-arm64.size.json"
      - "target/public-cli-artifacts/ctx-macos-arm64.candidate.json"
      - "target/public-cli-artifacts/ctx-macos-arm64.signing.json"
      - "target/public-cli-artifacts/ctx-macos-arm64.attestation.json"
      - "target/public-cli-artifacts/ctx-macos-arm64.attestation.cms"
      - "target/public-cli-artifacts/ctx-macos-arm64.codesign.txt"
      - "target/public-cli-artifacts/ctx-macos-arm64.execution.txt"
      - "target/public-cli-artifacts/ctx-macos-arm64.notary-*"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.tar.gz"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.tar.gz.sha256"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.tar.zst"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.tar.zst.sha256"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.tar.zst.asset.json"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.signing.json"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.attestation.json"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.attestation.cms"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.release-attestation.json"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.release-attestation.cms"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.codesign.txt"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.notary-*"
      - "target/public-cli-native-smoke/macos-arm64/candidate-smoke.json"
      - "target/public-cli-native-smoke/macos-arm64/**/smoke.log"
      - "target/public-cli-native-smoke/macos-arm64/**/daemon-smoke.log"
      - "target/public-cli-native-smoke/macos-arm64/**/daemon-status.*"
      - "target/public-cli-native-smoke/macos-arm64/**/semantic-search.*"

  - label: ":package: public CLI macos-x64"
    key: "public-cli-macos-x64"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      export CTX_RELEASE_MACOS_X64_KVM_RUNNER_ID=ctx-mac-gui-shared-x64
      export CTX_MACOS_RELEASE_SIGNING=required
      export CTX_MACOS_SIGNING_SECRET_SOURCE=infisical
      # Native x86_64 construction receives no signing values; its signer fetches at use.
      scripts/bazelw run //:ctx_release_macos_x64 --config=release -- \
        --output-dir target/public-cli-artifacts \
        --macos-llvm-task-root "$${CTX_RELEASE_MACOS_X64_LLVM_TASK_ROOT:?}"
    agents:
      queue: "ctx-mac-gui-shared-x64"
      os: "darwin"
      arch: "x86_64"
    concurrency: 1
    concurrency_group: "ctx-public-cli-macos-intel-native"
    timeout_in_minutes: 60
    artifact_paths:
      - "target/public-cli-artifacts/ctx-macos-x64"
      - "target/public-cli-artifacts/ctx-macos-x64.sha256"
      - "target/public-cli-artifacts/ctx-macos-x64.version"
      - "target/public-cli-artifacts/ctx-macos-x64.build-info.json"
      - "target/public-cli-artifacts/ctx-macos-x64.cdx.json"
      - "target/public-cli-artifacts/ctx-macos-x64.cdx.json.sha256"
      - "target/public-cli-artifacts/ctx-macos-x64.third-party-notices.txt"
      - "target/public-cli-artifacts/ctx-macos-x64.third-party-notices.txt.sha256"
      - "target/public-cli-artifacts/ctx-macos-x64.size.json"
      - "target/public-cli-artifacts/ctx-macos-x64.candidate.json"
      - "target/public-cli-artifacts/ctx-macos-x64.signing.json"
      - "target/public-cli-artifacts/ctx-macos-x64.attestation.json"
      - "target/public-cli-artifacts/ctx-macos-x64.attestation.cms"
      - "target/public-cli-artifacts/ctx-macos-x64.codesign.txt"
      - "target/public-cli-artifacts/ctx-macos-x64.execution.txt"
      - "target/public-cli-artifacts/ctx-macos-x64.notary-*"

  - label: ":test_tube: public CLI macos-x64 native semantic"
    key: "public-cli-macos-x64-native-smoke"
    depends_on: "public-cli-macos-x64"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.env("CTX_PUBLIC_CLI_NATIVE_SMOKE_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      export CTX_RELEASE_MACOS_X64_KVM_RUNNER_ID=ctx-mac-gui-shared-x64
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-macos-x64*" . \
        --step public-cli-macos-x64
      export CTX_MACOS_RELEASE_SIGNING=required
      export CTX_MACOS_SIGNING_SECRET_SOURCE=infisical
      # Native verification/build/smokes are not children of a secret-bearing process.
      scripts/check-macos-release-signing.sh \
        macos-x64 cli target/public-cli-artifacts/ctx-macos-x64
      expected_version="$(sed -n 's/^ctx //p' \
        target/public-cli-artifacts/ctx-macos-x64.version)"
      [[ -n "$${expected_version}" ]]
      scripts/run-native-candidate-smoke.sh \
        target/public-cli-artifacts/ctx-macos-x64 \
        tests/fixtures/custom-history-jsonl/basic.jsonl \
        "$${expected_version}" \
        target/public-cli-native-smoke/macos-x64-native/candidate-smoke.json
      scripts/build-onnxruntime-sidecar.sh macos-x64
      scripts/stage-github-release-assets.sh --transcode-runtime macos-x64
      smoke_root="target/public-cli-native-smoke/macos-x64-native"
      mkdir -p "$${smoke_root}"
      if ! scripts/smoke-daemon-semantic-release.sh \
        --runtime-archive target/public-cli-artifacts/ctx-onnxruntime-macos-x64.tar.gz \
        --runtime-platform macos-x64 \
        --ctx target/public-cli-artifacts/ctx-macos-x64 \
        --data-root "$${smoke_root}" \
        --require-authoritative \
        --keep-root >"$${smoke_root}/smoke.log" 2>&1; then
        cat "$${smoke_root}/smoke.log"
        exit 1
      fi
      cat "$${smoke_root}/smoke.log"
    agents:
      queue: "ctx-mac-gui-shared-x64"
      os: "darwin"
      arch: "x86_64"
    concurrency: 1
    concurrency_group: "ctx-public-cli-macos-intel-native"
    timeout_in_minutes: 180
    artifact_paths:
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.tar.gz"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.tar.gz.sha256"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.tar.zst"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.tar.zst.sha256"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.tar.zst.asset.json"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.signing.json"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.attestation.json"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.attestation.cms"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.release-attestation.json"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.release-attestation.cms"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.codesign.txt"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.notary-*"
      - "target/public-cli-native-smoke/macos-x64-native/candidate-smoke.json"
      - "target/public-cli-native-smoke/macos-x64-native/smoke.log"
      - "target/public-cli-native-smoke/macos-x64-native/**/daemon-smoke.log"
      - "target/public-cli-native-smoke/macos-x64-native/**/daemon-status.*"
      - "target/public-cli-native-smoke/macos-x64-native/**/semantic-search.*"

  - label: ":test_tube: public CLI windows-x64 native semantic"
    key: "public-cli-windows-x64-native-smoke"
    depends_on: "public-cli-windows-x64"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.env("CTX_PUBLIC_CLI_NATIVE_SMOKE_MATRIX") == "1"
    command: |
      rustup toolchain install 1.97.1 --profile minimal
      rustup run 1.97.1 cargo check --workspace --all-targets --all-features --locked
      buildkite-agent artifact download "target/public-cli-artifacts/ctx.exe*" . --step public-cli-windows-x64
      buildkite-agent artifact download "target/public-cli-artifacts/ctx-onnxruntime-windows-x64.zip*" . --step public-cli-windows-x64
      powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-windows-semantic-smoke-contract.ps1
      powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-windows-runtime-upgrade-extractor.ps1 -RuntimeArchive target/public-cli-artifacts/ctx-onnxruntime-windows-x64.zip
      powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/tests/run-native-candidate-smoke-test.ps1
      powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/run-native-candidate-smoke.ps1 -Binary target/public-cli-artifacts/ctx.exe -Fixture tests/fixtures/custom-history-jsonl/basic.jsonl -ExpectedVersionFile target/public-cli-artifacts/ctx.exe.expected-version -ResultPath target/public-cli-native-smoke/windows-x64/candidate-smoke.json
      powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-daemon-semantic-release.ps1 -Ctx target/public-cli-artifacts/ctx.exe -RuntimeArchive target/public-cli-artifacts/ctx-onnxruntime-windows-x64.zip -RuntimeMode onnxruntime -RuntimePlatform windows-x64 -DataRoot target/public-cli-native-smoke/windows-x64-onnxruntime -RequireAuthoritative -KeepRoot
    agents:
      queue: "windows-x64"
      os: "windows"
      arch: "x86_64"
    concurrency: 1
    concurrency_group: "ctx-public-cli-windows-native"
    timeout_in_minutes: 90
    artifact_paths:
      - "target/public-cli-native-smoke/windows-x64/candidate-smoke.json"
      - "target/public-cli-native-smoke/windows-x64-onnxruntime/**/daemon-smoke.log"

  - label: ":package: stage native-qualified GitHub release candidate"
    key: "github-release-candidate"
    depends_on:
      - "public-cli-linux-x64"
      - "public-cli-linux-aarch64"
      - "public-cli-macos-arm64"
      - "public-cli-macos-x64-native-smoke"
      - "public-cli-windows-x64-native-smoke"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.env("CTX_PUBLIC_CLI_NATIVE_SMOKE_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      source_commit="$(git rev-parse --verify HEAD^{commit})"
      mkdir -p target/public-cli-artifacts
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx*" . \
        --step public-cli-linux-x64
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-linux-aarch64*" . \
        --step public-cli-linux-aarch64
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-macos-arm64*" . \
        --step public-cli-macos-arm64
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64*" . \
        --step public-cli-macos-arm64
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-macos-x64*" . \
        --step public-cli-macos-x64
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-x64*" . \
        --step public-cli-macos-x64-native-smoke
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx.exe*" . \
        --step public-cli-windows-x64
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-windows-x64.zip*" . \
        --step public-cli-windows-x64
      CTX_PUBLIC_RELEASE_SOURCE_COMMIT="$${source_commit}" \
        scripts/stage-github-release-assets.sh \
          target/public-cli-artifacts \
          target/github-release-assets \
          target/github-release-authority
    agents:
      queue: "release-linux-managed"
      ctx-runner-class: "release-linux-control"
      os: "linux"
      arch: "x86_64"
    timeout_in_minutes: 30
    artifact_paths:
      - "target/github-release-assets/*"
      - "target/github-release-authority/*"

  - label: ":package: Semantic ONNX models"
    key: "semantic-model-archives"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      mkdir -p target/public-cli-artifacts target/semantic-model-sources
      python3 scripts/semantic-release-assets.py prepare-model \
        --variant cpu-fp32 \
        --output-dir target/semantic-model-sources/cpu-fp32
      python3 scripts/semantic-release-assets.py build-model \
        --variant cpu-fp32 \
        --source target/semantic-model-sources/cpu-fp32 \
        --output-dir target/public-cli-artifacts
      python3 scripts/semantic-release-assets.py prepare-model \
        --variant accelerator-o4-fp16 \
        --output-dir target/semantic-model-sources/accelerator-o4-fp16
      python3 scripts/semantic-release-assets.py build-model \
        --variant accelerator-o4-fp16 \
        --source target/semantic-model-sources/accelerator-o4-fp16 \
        --output-dir target/public-cli-artifacts
    agents:
      queue: "release-linux-managed"
      ctx-runner-class: "release-linux-control"
      os: "linux"
      arch: "x86_64"
    timeout_in_minutes: 60
    artifact_paths:
      - "target/public-cli-artifacts/ctx-multilingual-e5-small-onnx-fp32-1.0.0.tar.xz"
      - "target/public-cli-artifacts/ctx-multilingual-e5-small-onnx-fp32-1.0.0.tar.xz.sha256"
      - "target/public-cli-artifacts/ctx-multilingual-e5-small-onnx-fp32-1.0.0.tar.xz.asset.json"
      - "target/public-cli-artifacts/ctx-multilingual-e5-small-onnx-o4-fp16-1.0.0.tar.xz"
      - "target/public-cli-artifacts/ctx-multilingual-e5-small-onnx-o4-fp16-1.0.0.tar.xz.sha256"
      - "target/public-cli-artifacts/ctx-multilingual-e5-small-onnx-o4-fp16-1.0.0.tar.xz.asset.json"

  - label: ":package: Semantic Core ML bundle"
    key: "semantic-coreml-archive"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      mkdir -p target/public-cli-artifacts
      python3 scripts/semantic-release-assets.py prepare-coreml \
        --output-dir target/semantic-coreml-source
      python3 scripts/semantic-model-bundle/produce.py \
        --tokenizer target/semantic-coreml-source/tokenizer.json \
        --document-model target/semantic-coreml-source/document.mlpackage \
        --query-model target/semantic-coreml-source/query.mlpackage \
        --model-license target/semantic-coreml-source/LICENSES/MODEL_LICENSE.txt \
        --bundle-version 1.0.0 \
        --document-batch-size 16 \
        --query-batch-size 1 \
        --sequence-length 512 \
        --output-dir target/semantic-coreml-bundle \
        --archive target/public-cli-artifacts/ctx-multilingual-e5-small-coreml-fp16-1.0.0.tar.xz
    agents:
      queue: "ctx-release-macos-arm64"
      os: "darwin"
      arch: "arm64"
    concurrency: 1
    concurrency_group: "ctx-public-semantic-coreml"
    timeout_in_minutes: 120
    artifact_paths:
      - "target/public-cli-artifacts/ctx-multilingual-e5-small-coreml-fp16-1.0.0.tar.xz"
      - "target/public-cli-artifacts/ctx-multilingual-e5-small-coreml-fp16-1.0.0.tar.xz.sha256"
      - "target/public-cli-artifacts/ctx-multilingual-e5-small-coreml-fp16-1.0.0.tar.xz.asset.json"

  - label: ":package: Semantic CUDA runtime"
    key: "semantic-runtime-linux-cuda12"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      scripts/build-onnxruntime-sidecar.sh linux-x64-cuda12
    agents:
      queue: "release-linux-managed"
      ctx-runner-class: "release-linux-control"
      os: "linux"
      arch: "x86_64"
    timeout_in_minutes: 60
    artifact_paths:
      - "target/public-cli-artifacts/ctx-onnxruntime-linux-x64-cuda12.tar.zst"
      - "target/public-cli-artifacts/ctx-onnxruntime-linux-x64-cuda12.tar.zst.sha256"
      - "target/public-cli-artifacts/ctx-onnxruntime-linux-x64-cuda12.tar.zst.asset.json"

  - label: ":package: Semantic Windows ML runtime"
    key: "semantic-runtime-windows-ml"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      bash scripts/build-onnxruntime-sidecar.sh windows-x64-windowsml
      powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-windows-semantic-smoke-contract.ps1
    agents:
      queue: "windows-x64"
      os: "windows"
      arch: "x86_64"
    concurrency: 1
    concurrency_group: "ctx-public-semantic-windows-native"
    timeout_in_minutes: 90
    artifact_paths:
      - "target/public-cli-artifacts/ctx-windowsml-windows-x64.zip"
      - "target/public-cli-artifacts/ctx-windowsml-windows-x64.zip.sha256"
      - "target/public-cli-artifacts/ctx-windowsml-windows-x64.zip.asset.json"

  - label: ":package: Semantic macos-x64 runtime"
    key: "semantic-runtime-macos-x64"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      export CTX_MACOS_RELEASE_SIGNING=required
      export CTX_MACOS_SIGNING_SECRET_SOURCE=infisical
      scripts/build-onnxruntime-sidecar.sh macos-x64
    agents:
      queue: "ctx-mac-gui-shared-x64"
      os: "darwin"
      arch: "x86_64"
    concurrency: 1
    concurrency_group: "ctx-public-cli-macos-intel-native"
    timeout_in_minutes: 120
    artifact_paths:
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.tar.zst"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.tar.zst.sha256"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.tar.zst.asset.json"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.signing.json"
      - "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.attestation.cms"

  - label: ":package: gather unsigned Semantic release handoff"
    key: "semantic-release-handoff"
    depends_on:
      - "public-cli-linux-x64"
      - "public-cli-linux-aarch64"
      - "public-cli-macos-arm64"
      - "semantic-model-archives"
      - "semantic-coreml-archive"
      - "semantic-runtime-linux-cuda12"
      - "semantic-runtime-windows-ml"
      - "semantic-runtime-macos-x64"
    if: build.env("CTX_PUBLIC_CLI_ARTIFACT_MATRIX") == "1" && build.env("CTX_PUBLIC_CLI_NATIVE_SMOKE_MATRIX") == "1" && build.branch == "main" && build.pull_request.id == null
    command: |
      mkdir -p target/public-cli-artifacts
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-linux-x64.tar.zst*" . \
        --step public-cli-linux-x64
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-linux-aarch64*" . \
        --step public-cli-linux-aarch64
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-arm64.tar.zst*" . \
        --step public-cli-macos-arm64
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-multilingual-e5-small-onnx-fp32-1.0.0.tar.xz*" . \
        --step semantic-model-archives
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-multilingual-e5-small-onnx-o4-fp16-1.0.0.tar.xz*" . \
        --step semantic-model-archives
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-multilingual-e5-small-coreml-fp16-1.0.0.tar.xz*" . \
        --step semantic-coreml-archive
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-linux-x64-cuda12.tar.zst*" . \
        --step semantic-runtime-linux-cuda12
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-windowsml-windows-x64.zip*" . \
        --step semantic-runtime-windows-ml
      buildkite-agent artifact download \
        "target/public-cli-artifacts/ctx-onnxruntime-macos-x64.tar.zst*" . \
        --step semantic-runtime-macos-x64
      scripts/stage-semantic-release-handoff.sh \
        target/public-cli-artifacts target/semantic-release-handoff
    agents:
      queue: "release-linux-managed"
      ctx-runner-class: "release-linux-control"
      os: "linux"
      arch: "x86_64"
    timeout_in_minutes: 30
    artifact_paths:
      - "target/semantic-release-handoff/*"
